name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось?
      description: Что делали, чего ожидали, что произошло.
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Mac и версия macOS
      placeholder: Intel, macOS 13.6
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Версия Minerva Noema
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Не прикладывайте файлы с личными данными.
