name: Bug · Ошибка
description: Something does not work · Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? · Что случилось?
      description: What you did, what you expected, what happened. · Что делали, чего ожидали, что произошло.
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Mac and macOS version · Mac и версия macOS
      placeholder: M1, macOS 27
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: MindNotes version · Версия MindNotes
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Как воспроизвести
      description: Do not attach files with personal data. · Не прикладывайте файлы с личными данными.
